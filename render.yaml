services:
  - type: web
    name: banking-backend
    env: python
    region: singapore
    plan: free
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: banking-db
          property: connectionString
      - key: EXTRA_CORS_ORIGINS
        value: "https://banking-frontend.onrender.com"
        # In Render dashboard, you can update this to the actual frontend URL later if needed.

  - type: web
    name: banking-frontend
    env: node
    region: singapore
    plan: free
    buildCommand: "cd frontend && npm install && npm run build"
    startCommand: "cd frontend && node server.js"
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: "https://banking-backend.onrender.com"
        # Update this to your actual Render backend URL

databases:
  - name: banking-db
    databaseName: market_analyzer
    user: market_user
    plan: free
    region: singapore
